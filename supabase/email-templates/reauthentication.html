<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Security verification code</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }
    
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    
    @media only screen and (max-width: 600px) {
      .email-wrapper { padding: 20px 12px !important; }
      .email-card { padding: 32px 24px !important; border-radius: 16px !important; }
      .otp-box { font-size: 24px !important; letter-spacing: 6px !important; padding: 10px 16px !important; }
    }

    @media (prefers-color-scheme: dark) {
      body, .bg-body { background-color: #09090b !important; }
      .email-card { background-color: #121215 !important; border-color: #27272a !important; }
      .text-title { color: #fafafa !important; }
      .text-body { color: #a1a1aa !important; }
      .text-muted { color: #71717a !important; }
      .otp-container { background-color: #18181b !important; border-color: #3f3f46 !important; color: #fafafa !important; }
      .divider { border-color: #27272a !important; }
    }
  </style>
</head>
<body class="bg-body" style="margin: 0; padding: 0; width: 100% !important; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">

  <table border="0" cellpadding="0" cellspacing="0" width="100%" class="bg-body" style="background-color: #f8fafc; padding: 48px 16px;">
    <tr>
      <td align="center" valign="top">
        
        <table border="0" cellpadding="0" cellspacing="0" width="100%" class="email-card" style="max-width: 500px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 40px 36px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);">
          
          <!-- Logo & Brand Header -->
          <tr>
            <td align="left" style="padding-bottom: 32px;">
              <table border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td valign="middle" style="padding-right: 10px;">
                    <img src="https://krasola.ambrishchaurasia0.workers.dev/icons/icon-192.svg" alt="Krasola" width="30" height="30" style="display: block; width: 30px; height: 30px; border-radius: 8px;" onerror="this.style.display='none'; this.nextSibling.style.display='inline-block';" />
                    <span style="display: none; width: 30px; height: 30px; line-height: 30px; text-align: center; background: #4f46e5; color: #ffffff; font-weight: 800; font-size: 16px; border-radius: 8px;">K</span>
                  </td>
                  <td valign="middle">
                    <span class="text-title" style="font-size: 17px; font-weight: 700; color: #09090b; letter-spacing: -0.3px;">Krasola</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Message Body -->
          <tr>
            <td align="left">
              
              <h1 class="text-title" style="margin: 0 0 16px 0; font-size: 22px; font-weight: 700; color: #09090b; letter-spacing: -0.4px; line-height: 1.3;">
                Verification code
              </h1>
              
              <p class="text-body" style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #52525b;">
                Enter this one-time code to verify your identity and complete your request in Krasola:
              </p>

              <!-- OTP Code Display Box -->
              <table border="0" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                <tr>
                  <td>
                    <div class="otp-container otp-box" style="display: inline-block; background-color: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 12px; padding: 12px 24px; font-size: 28px; font-weight: 700; letter-spacing: 8px; color: #09090b; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
                      {{ .Token }}
                    </div>
                  </td>
                </tr>
              </table>

              <!-- Security Note -->
              <p class="text-muted" style="margin: 0; font-size: 13px; line-height: 1.5; color: #71717a;">
                This code expires in 10 minutes. Never share this code with anyone.
              </p>

            </td>
          </tr>

          <!-- Subtle Footer -->
          <tr>
            <td align="left" style="padding-top: 36px;">
              <p class="text-muted" style="margin: 0; font-size: 12px; color: #a1a1aa;">
                Krasola &middot; by Ambrisoft
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
